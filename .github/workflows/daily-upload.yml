name: Daily AI Cartoon Video Generation & Upload

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      
      - run: |
          python -m pip install --upgrade pip
          pip install google-auth-oauthlib google-auth-httplib2 google-api-python-client
          pip install google-cloud-texttospeech anthropic requests
      
      - run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
      
      - run: python auto_video_generator.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEONARDO_API_KEY: ${{ secrets.LEONARDO_API_KEY }}
      
      - run: rm -f credentials.json
